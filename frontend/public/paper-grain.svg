<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480">
  <!--
    Paper tooth, drawn at the size it is painted at.

    This replaces paper-fiber.svg, which drew sixteen curved strokes in a 150x150 viewBox and
    was then painted into a 480x480 tile - a 3.2x enlargement that turned intended fibre into
    discrete squiggles the eye reads as stray hairs. The fix is not a smaller stroke: it is a
    texture with no motif to enlarge in the first place.

    stitchTiles="stitch" is what makes the noise continuous across tile boundaries, so the
    480px repeat leaves no visible seam and the chat-switch wipe (ChatApp.tsx BG_TILE_PX)
    still slides by whole tiles.
  -->
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" stitchTiles="stitch" result="noise" />
    <feColorMatrix in="noise" type="saturate" values="0" />
  </filter>
  <rect width="480" height="480" filter="url(#grain)" opacity="0.055" />
</svg>
