name: CI

# The four commands a merge has to clear, on the same Python and Node the deployment uses.
# No path filters: synth builds the frontend and reads config.yaml, so a path filter would
# skip the suite most likely to catch the break.
on:
  pull_request:
  push:
    branches: [main, dev]

# A branch that gets two pushes a minute apart only needs the second one checked.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only: nothing here comments, tags, or deploys.
permissions:
  contents: read

jobs:
  python:
    name: ${{ matrix.suite }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # One suite failing must not hide the state of the other two.
      fail-fast: false
      matrix:
        suite: [app, scraper, infra]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # The Lambda runtime, pinned as _LAMBDA_PYTHON in infra_stack.py.
          python-version: '3.13'
          cache: pip
          cache-dependency-path: ${{ matrix.suite }}/requirements*.txt

      # Both files, because the tests import what the Lambda imports.
      - name: Install dependencies
        working-directory: ${{ matrix.suite }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      # `python -m pytest`, never bare `pytest`: -m puts the working directory on sys.path,
      # which is what makes the app suite's flat imports resolve at all. The infra suite
      # needs Docker, because synth bundles a deps layer and builds the site in a container.
      - name: Run tests
        working-directory: ${{ matrix.suite }}
        run: python -m pytest -q

  frontend:
    name: frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Matches _NODE_BUILD_IMAGE in infra_stack.py, so the two builds cannot drift.
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` installs exactly the lockfile, so CI cannot pass on a tree that would not deploy.
      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Duplicates the infra job's containerized build, because it names the failure: a red
      # "frontend build" says the site is broken, where a red "infra tests" could be anything.
      - name: Build
        working-directory: frontend
        run: npm run build
